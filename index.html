<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otávio Porteiro | Portfólio</title>

<style>

/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY */
body {
    font-family: Arial, sans-serif;
    background: #0a0a0a;
    color: white;
    text-align: center;
    overflow-x: hidden;
}

/* FUNDO PARTÍCULAS */
#particles {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, #111 0%, #000 100%);
    z-index: -1;
}

/* HEADER */
header {
    padding: 40px 20px;
}

/* FOTO */
.foto {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    border: 3px solid #00ffcc;
    transition: 0.4s;
}
.foto:hover {
    transform: scale(1.08);
}

/* NOME */
.nome {
    font-size: 32px;
    margin: 15px 0;
}

/* NAV */
nav {
    position: sticky;
    top: 10px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    padding: 10px;
    border-radius: 12px;
    width: fit-content;
    margin: auto;
}

nav button {
    padding: 10px 20px;
    margin: 5px;
    border: none;
    background: #111;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

nav button:hover {
    background: #00ffcc;
    color: black;
    transform: translateY(-2px);
}

/* CONTEÚDO */
.content {
    max-width: 750px;
    margin: 30px auto;
    padding: 25px;
    display: none;
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    backdrop-filter: blur(10px);
}

.content.active {
    display: block;
    animation: fadeUp 0.6s ease;
}

@keyframes fadeUp {
    from {opacity:0; transform: translateY(20px);}
    to {opacity:1; transform: translateY(0);}
}

.content:hover {
    transform: translateY(-5px);
}

/* TITULOS */
h2 {
    margin-bottom: 15px;
    border-bottom: 2px solid #00ffcc;
    display: inline-block;
}

/* BOTÕES */
.btn {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 25px;
    background: #00ffcc;
    color: black;
    border-radius: 10px;
    text-decoration: none;
    transition: 0.3s;
}

.btn:hover {
    background: #00c9a7;
}

/* FRASE */
.punchline {
    margin: 50px;
    color: #00ffcc;
    font-size: 22px;
}

</style>
</head>

<body>

<div id="particles"></div>

<header>

<img src="foto.jpg" class="foto">

<div class="nome">Otávio Porteiro</div>

<nav>
<button onclick="showTab('sobre')">Sobre</button>
<button onclick="showTab('curriculo')">Currículo</button>
<button onclick="showTab('contato')">Contato</button>
</nav>

</header>

<!-- SOBRE -->
<div id="sobre" class="content active">
<h2>Sobre</h2>
<p>
Tenho 18 anos e estou evoluindo na área de tecnologia, estudando desenvolvimento web e construindo projetos reais.
</p>
</div>

<!-- CURRICULO -->
<div id="curriculo" class="content">
<h2>Currículo</h2>
<a href="OTAVIO PORTEIRO.pdf" target="_blank" class="btn">Abrir Currículo</a>
</div>

<!-- CONTATO -->
<div id="contato" class="content">
<h2>Contato</h2>
<a href="https://www.linkedin.com/in/otavioporteiro" target="_blank" class="btn">LinkedIn</a>
<br><br>
<a href="https://github.com/otavioporteiro" target="_blank" class="btn">GitHub</a>
</div>

<div class="punchline">
"Legado não se explica — se constrói."
</div>

<script>

/* TABS */
function showTab(tabId){
    document.querySelectorAll('.content')
    .forEach(el => el.classList.remove('active'));

    document.getElementById(tabId)
    .classList.add('active');
}

/* PARTÍCULAS */
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");
document.getElementById("particles").appendChild(canvas);

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<80;i++){
    particles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*2,
        dx: (Math.random()-0.5),
        dy: (Math.random()-0.5)
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle="#00ffcc";
        ctx.fill();

        p.x+=p.dx;
        p.y+=p.dy;
    });

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
